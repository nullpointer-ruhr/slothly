<!doctype html>
<html lang="de"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Slothly</title>
<meta name="theme-color" content="#1f4fd1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Slothly">
<link rel="manifest" href="/manifest.webmanifest?v=__ICONV__">
<link rel="icon" href="/favicon.ico?v=__ICONV__">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=__ICONV__">
<style>
@font-face{font-family:"Barlow";font-weight:400;font-display:swap;src:url(/fonts/barlow-400.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:500;font-display:swap;src:url(/fonts/barlow-500.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:600;font-display:swap;src:url(/fonts/barlow-600.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:600;font-display:swap;src:url(/fonts/barlow-condensed-600.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:700;font-display:swap;src:url(/fonts/barlow-condensed-700.woff2) format("woff2")}
:root{box-sizing:border-box}
body{margin:0;padding:0;padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
</style>
<style>
/* Layout: one-column gym tool, sticky week/day switcher, cards per superset block, fixed rest timer bar */
:root{
  --bg:#eef0f4; --surface:#ffffff; --surface2:#f6f7fa; --ink:#15181e; --muted:#5b6372; --line:#dce0e8;
  --accent:#1f4fd1; --accent-ink:#ffffff; --accent-soft:#e3e9fb;
  --done:#1d8549; --done-soft:#dff3e7; --warn:#a9500f; --warn-soft:#fbecdf;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1115; --surface:#171b21; --surface2:#1d222a; --ink:#e7eaf0; --muted:#8e97a5; --line:#2a3039;
  --accent:#7097ff; --accent-ink:#0b1020; --accent-soft:#1d2741;
  --done:#46c27b; --done-soft:#16291f; --warn:#e8935a; --warn-soft:#2e2118; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0e1115; --surface:#171b21; --surface2:#1d222a; --ink:#e7eaf0; --muted:#8e97a5; --line:#2a3039;
  --accent:#7097ff; --accent-ink:#0b1020; --accent-soft:#1d2741;
  --done:#46c27b; --done-soft:#16291f; --warn:#e8935a; --warn-soft:#2e2118; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,textarea{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header .wrap{padding-block:10px 10px;display:grid;gap:8px}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
h1{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.02em;margin:0;text-transform:uppercase}
h1 span{color:var(--muted);font-weight:600}
.status{font-size:12px;color:var(--muted);white-space:nowrap}
.status b{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin-right:5px;vertical-align:1px}
.status.ok b{background:var(--done)} .status.busy b{background:var(--accent)} .status.err b{background:var(--warn)}
.weeks{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wk{border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:5px 0 4px;text-align:center;cursor:pointer;font-family:var(--f-display);font-weight:600;font-size:16px;line-height:1.1}
.wk small{display:block;font-family:var(--f-body);font-size:10px;color:var(--muted);font-weight:500;letter-spacing:.02em}
.wk.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)} .wk.on small{color:inherit;opacity:.85}
.wk .dots{display:flex;justify-content:center;gap:3px;margin-top:3px}
.wk .dots i{width:5px;height:5px;border-radius:50%;background:var(--line)} .wk .dots i.f{background:var(--done)} .wk .dots i.p{background:var(--warn)}
.wk.on .dots i{background:color-mix(in srgb,var(--accent-ink) 35%,transparent)} .wk.on .dots i.f{background:var(--accent-ink)}
.days{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:3px}
.day{border:0;background:transparent;border-radius:8px;padding:6px 4px;cursor:pointer;text-align:center;min-width:0}
.day b{display:block;font-family:var(--f-display);font-size:17px;font-weight:600;line-height:1.1}
.day small{display:block;font-size:11px;color:var(--muted)}
.day.on{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.day .ok{color:var(--done)}
main .wrap{padding-block:14px 120px;display:grid;gap:14px}
.meta{display:grid;gap:8px}
.meta h2{font-family:var(--f-display);font-size:30px;font-weight:700;margin:0;line-height:1;text-wrap:balance}
.meta p{margin:0;color:var(--muted);font-size:14px}
.phase{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--done);transition:width .3s}
.barlbl{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
section.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.boxh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:10px 14px 0}
.boxh h3{margin:0;font-family:var(--f-display);font-size:15px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.boxh span{font-size:12px;color:var(--muted)}
.checks{display:grid;gap:2px;padding:6px 6px 8px}
.ci{display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px;cursor:pointer;border:0;background:transparent;text-align:left;width:100%}
.ci:hover{background:var(--surface2)}
.ci .tx{min-width:0;font-size:15px}
.ci .tx small{display:block;color:var(--muted);font-size:13px}
.tick{flex:none;width:26px;height:26px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;background:var(--surface)}
.tick svg{width:16px;height:16px;opacity:0}
.on>.tick,.tick.on{background:var(--done);border-color:var(--done)} .on>.tick svg,.tick.on svg{opacity:1}
.tick svg path{stroke:#fff}
.ci.on .tx{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.ex{padding:12px 14px 14px;display:grid;gap:10px;border-top:1px solid var(--line)}
.ex:first-of-type{border-top:0}
.exh{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
.blk{font-family:var(--f-display);font-weight:700;font-size:18px;min-width:36px;height:30px;padding:0 6px;border-radius:7px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.blk.reha{background:var(--warn-soft);color:var(--warn)}
.exn{min-width:0}
.exn h4{margin:0;font-size:17px;font-weight:600;line-height:1.25}
.exn .mu{font-size:13px;color:var(--muted);margin-top:2px}
.facts{display:flex;flex-wrap:wrap;gap:6px}
.fact{font-size:13px;padding:3px 8px;border-radius:6px;background:var(--surface2);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.fact.rx{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.fact.sh{background:var(--warn-soft);border-color:transparent;color:var(--warn);font-weight:500}
.last{font-size:13px;color:var(--muted)} .last b{color:var(--ink);font-weight:600}
.ramp{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.rb{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 9px 5px 6px;cursor:pointer;font-size:13px}
.rb .tick{width:18px;height:18px;border-radius:5px;border-width:2px} .rb .tick svg{width:12px;height:12px}
.rb.on{color:var(--muted)}
.sets{display:grid;gap:6px}
.sr{display:grid;grid-template-columns:28px 1fr 1fr 64px 44px;gap:6px;align-items:center}
.sr.hd{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:0 2px}
.sn{font-family:var(--f-display);font-weight:600;font-size:17px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.sr input{width:100%;min-width:0;height:44px;border:1px solid var(--line);border-radius:9px;background:var(--surface2);padding:0 10px;font-size:17px;font-variant-numeric:tabular-nums}
.sr input:focus,textarea:focus,.fb input:focus{outline:2px solid var(--accent);outline-offset:-1px;background:var(--surface)}
.sr input::placeholder{color:var(--muted);opacity:.7}
.sb{width:44px;height:44px;border-radius:10px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;padding:0}
.sb svg{width:22px;height:22px;opacity:.25} .sb svg path{stroke:var(--ink)}
.sb.on{background:var(--done);border-color:var(--done)} .sb.on svg{opacity:1} .sb.on svg path{stroke:#fff}
.sr.done input{border-color:color-mix(in srgb,var(--done) 45%,var(--line))}
.note{width:100%;min-height:38px;border:1px dashed var(--line);border-radius:9px;background:transparent;padding:8px 10px;font-size:14px;resize:vertical}
.ss{display:block;font-size:12px;color:var(--muted);letter-spacing:.04em;padding:10px 14px 0;text-transform:uppercase;font-weight:600}
.hint{font-size:14px;color:var(--muted);padding:12px 14px;margin:0;display:grid;gap:6px}
.fb{display:grid;gap:12px;padding:10px 14px 14px}
.fb .row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fb label{display:grid;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.fb input{height:44px;border:1px solid var(--line);border-radius:9px;background:var(--surface2);padding:0 10px;font-size:17px;width:100%;min-width:0;font-variant-numeric:tabular-nums}
.fb textarea{min-height:64px;border:1px solid var(--line);border-radius:9px;background:var(--surface2);padding:8px 10px;font-size:15px;resize:vertical;width:100%}
.form5{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.form5 button{height:44px;border-radius:9px;border:1px solid var(--line);background:var(--surface2);font-family:var(--f-display);font-size:20px;font-weight:600;cursor:pointer}
.form5 button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.formhint{font-size:13px;color:var(--muted)}
.formhint.low{color:var(--warn)}
.tbtn{text-decoration:none;display:inline-block;border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:4px 10px;font-size:13px;cursor:pointer;color:var(--ink)}
.tbtn.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.rehabtn{justify-self:start;border:1px solid var(--warn);color:var(--warn);background:var(--warn-soft);border-radius:9px;height:40px;padding:0 14px;font-weight:600;cursor:pointer}
.rconf{background:var(--warn-soft);border-radius:10px;padding:10px 12px;display:grid;gap:10px;font-size:14px}
.rconf .btns{display:flex;gap:8px;flex-wrap:wrap}
.rconf .go{background:var(--warn);border:0;color:var(--surface);border-radius:9px;height:40px;padding:0 14px;font-weight:600;cursor:pointer}
.meta p.shift{color:var(--warn);font-weight:500}
.rlist{display:grid}
.vid{display:inline-block;margin-top:4px;font-size:13px;font-weight:600;color:var(--accent);text-decoration:none;padding:2px 0}
.vid:hover{text-decoration:underline}
.pm{display:grid;gap:10px;padding:14px}
.pm h3{font-family:var(--f-display);font-size:20px;margin:0}
.pm p{margin:0;font-size:15px}
.pm .acts{display:flex;gap:8px;flex-wrap:wrap}
.pm .up{position:relative;overflow:hidden;background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.pm .up input{position:absolute;inset:0;opacity:0;cursor:pointer}
.prev{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:8px;background:var(--surface2)}
.prev h4{margin:0;font-size:16px}
.prev ul{margin:0;padding-left:18px;display:grid;gap:3px;font-size:14px}
.prev .bad{color:var(--warn)} .prev .muted{color:var(--muted);font-size:13px}
.go{background:var(--accent);border:0;color:var(--accent-ink);border-radius:9px;height:40px;padding:0 14px;font-weight:600;cursor:pointer}
.plist .rrow small{display:block;color:var(--muted);font-size:12px}
.plist{display:grid;gap:4px}
.prow{border-bottom:1px solid var(--line);padding-bottom:8px}
.prow .rrow{border-bottom:0}
.acts.small{gap:6px}
.tbtn.danger{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}
.pconf .rconf{margin-top:8px}
.pconf .btns .tbtn{height:40px;display:inline-flex;align-items:center}
.rrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
/* rules */
.rules{display:grid;gap:14px}
.rules h3{font-family:var(--f-display);font-size:20px;margin:0 0 6px}
.rules p,.rules li{font-size:15px;margin:0}
.rules ul{margin:0;padding-left:18px;display:grid;gap:6px}
.rules .box{padding:14px;display:grid;gap:8px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{border-bottom:1px solid var(--line);padding:6px 6px;text-align:left;vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
/* ---------- 0.2: Kopfzeile ---------- */
/* Langer Planname darf die Seite nicht verbreitern (sonst zoomt iOS heraus und die Uhr ragt aus dem Bild, #7) */
.top{align-items:center;min-width:0}
.top h1{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topr{display:flex;align-items:center;gap:8px;flex:none}
@media (max-width:480px){.status:not(.err){font-size:0}.status:not(.err) b{margin:0;width:9px;height:9px}}
.clockbtn{flex:none;width:38px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface2);cursor:pointer;display:grid;place-items:center;padding:0}
.clockbtn svg{width:20px;height:20px} .clockbtn svg *{stroke:var(--ink)}
.runchip{border:0;background:var(--done);color:#fff;border-radius:999px;padding:4px 10px;font-size:13px;font-weight:600;cursor:pointer;font-variant-numeric:tabular-nums;white-space:nowrap}
/* ---------- Training starten/beenden (#12) ---------- */
.sess{display:grid;gap:8px}
.go.wide{width:100%;height:48px;font-size:17px}
.sinfo{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px}
.sinfo b{font-variant-numeric:tabular-nums}
.sbtns{display:flex;gap:8px;flex-wrap:wrap}
.sbtns .tbtn{height:40px;display:inline-flex;align-items:center;font-size:14px}
.badge{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600}
.badge.run{background:var(--done);color:#fff} .badge.ok{background:var(--done-soft);color:var(--done)} .badge.ab{background:var(--warn-soft);color:var(--warn)}
.finbox{background:var(--accent-soft);border-radius:10px;padding:12px;display:grid;gap:10px;font-size:14px}
.finbox ul{margin:0;padding-left:18px}
.finbox label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.finbox input{height:40px;border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:0 10px;font-size:16px}
.warnbox{background:var(--warn-soft);color:var(--ink);border-radius:10px;padding:10px 12px;display:grid;gap:8px;font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom));z-index:35;background:var(--ink);color:var(--surface);padding:8px 14px;border-radius:999px;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
/* ---------- Sätze: Felder je Erfassung (#10), Runden (#8) ---------- */
.sr{display:grid;gap:6px;align-items:end;border-radius:10px;transition:background .2s}
.sr .lb{font-family:var(--f-display);font-weight:600;font-size:16px;color:var(--muted);text-align:center;align-self:center;line-height:1.05;white-space:nowrap}
.sr .lb small{display:block;font-family:var(--f-body);font-size:10px;font-weight:500}
.sr .fi{display:grid;gap:2px;min-width:0}
.sr .fi span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding-left:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr .iw{display:flex;gap:4px;min-width:0}
.sr .clk{flex:none;width:40px;height:44px;border-radius:9px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;padding:0}
.sr .clk svg{width:18px;height:18px} .sr .clk svg *{stroke:var(--ink)}
.sr .sb{align-self:end}
.sr.next{background:var(--accent-soft);box-shadow:0 0 0 6px var(--accent-soft)}
.sr.filler .lb{color:var(--warn)}
.round{border-top:1px solid var(--line);padding:10px 14px 12px;display:grid;gap:10px}
.round .rn{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;display:flex;justify-content:space-between}
.round.done .rn b{color:var(--done)}
.round .ph{font-size:12px;color:var(--warn);margin:-4px 0 -4px 2px}
.exd{border-top:1px solid var(--line)}
.exd:first-of-type{border-top:0}
.exd>summary{list-style:none;cursor:pointer;padding:10px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.exd>summary::-webkit-details-marker{display:none}
.exd>summary h4{margin:0;font-size:16px;font-weight:600;line-height:1.25}
.exd>summary small{display:block;color:var(--muted);font-size:13px}
.exd>summary .chev{color:var(--muted);transition:transform .2s}
.exd[open]>summary .chev{transform:rotate(90deg)}
.exd .exb{padding:0 14px 12px;display:grid;gap:8px}
.ssrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px 0}
.ssrow .ss{padding:0}
.vtog{border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:3px 8px;font-size:12px;cursor:pointer;color:var(--muted)}
/* ---------- Skill-Block (#5) ---------- */
.skhint{font-size:13px;color:var(--muted);padding:2px 14px 0}
.ci .vid{margin-top:0;margin-left:6px;font-size:12px}
/* ---------- Tabata im Plan (#11) ---------- */
.tbres{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.tbres label{display:grid;gap:2px;font-size:10px;color:var(--muted);text-transform:uppercase}
.tbres input{height:40px;border:1px solid var(--line);border-radius:9px;background:var(--surface2);padding:0 8px;font-size:16px;width:100%;min-width:0}
.tbsum{font-size:14px;color:var(--muted)} .tbsum b{color:var(--ink)}
/* ---------- Uhr: Leiste (#7/#9) ---------- */
.timer{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--ink);color:var(--surface);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -2px 12px rgba(0,0,0,.2)}
body.kb .timer{bottom:auto;top:0;padding-bottom:0;padding-top:env(safe-area-inset-top,0px)}
.timer .wrap{display:flex;align-items:center;gap:10px;padding-block:8px}
.timer .t{font-family:var(--f-display);font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1;min-width:78px;cursor:pointer}
.timer .l{flex:1;min-width:0;display:grid;font-size:13px;line-height:1.25;cursor:pointer}
.timer .l b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer .l small{opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer .tbs{display:flex;gap:6px;flex:none}
.timer .tbs button{border:1px solid color-mix(in srgb,var(--surface) 35%,transparent);background:transparent;color:var(--surface);border-radius:9px;height:40px;padding:0 10px;cursor:pointer;font-weight:600;font-size:14px}
.timer.over{background:var(--done)}
.timer.next{background:color-mix(in srgb,var(--ink) 80%,var(--accent))}

</head><body>
<header><div class="wrap">
  <div class="top"><h1>Slothly</h1>
    <div class="topr"><button type="button" class="runchip" id="runchip" hidden></button><div class="status" id="status"><b></b>lädt…</div>
    <button type="button" class="clockbtn" id="clockbtn" aria-label="Uhr: Stoppuhr, Timer, Intervall, AMRAP, EMOM"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9.5 2.5h5M12 2.5V5"/></svg></button></div></div>
  <div class="weeks" id="weeks"></div>

</div></header>
<main><div class="wrap" id="main"></div></main>
<div class="timer" id="timer" hidden><i class="tb" id="tbar"></i><div class="wrap">
  <div class="t" id="tt" data-tact="open">0:00</div><div class="l" data-tact="open"><b id="tl"></b><small id="ts"></small></div>
  <div class="tbs" id="tbs"></div>
</div></div>

<div class="toast" id="toast" hidden></div>
<script>
(function(){
"use strict";
/* ======================================================================
   Slothly 0.3 · Oberfläche
   Plan aus der API, Einträge je Einheit als ein Dokument (offline-fähig),
   Uhr (Pause, Stoppuhr, Timer, Intervall, AMRAP, EMOM, For Time), Trainingsstatus, Verschieben, Verwaltung.
   ====================================================================== */
const VERSION='0.3.0';
let P=null,DAYS=[],PHASE=[],START=null,NW=6,ND=3,OFFS=[0,2,4];
const WD=['So','Mo','Di','Mi','Do','Fr','Sa'];
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const md=t=>esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
const ID=(w,d)=>'w'+w+'d'+(d+1);
const vidUrl=q=>'https://www.youtube.com/results?search_query='+encodeURIComponent(q);
const TICK='<svg viewBox="0 0 16 16"><path d="M3 8.5l3.2 3L13 4.5" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const TICKB='<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const CLKI='<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9.5 2.5h5"/></svg>';

/* ---------- Datum ---------- */
function iso(x){return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')}
function fromIso(s){const p=s.split('-');return new Date(+p[0],p[1]-1,+p[2])}
const isIso=s=>typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s);
const wdOf=x=>WD[x.getDay()];
const fmtD=x=>String(x.getDate()).padStart(2,'0')+'.'+String(x.getMonth()+1).padStart(2,'0')+'.';
const fmtDL=x=>wdOf(x)+' '+fmtD(x)+x.getFullYear();
const hhmm=ms=>{const d=new Date(ms);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const today0=()=>{const t=new Date();t.setHours(0,0,0,0);return t};
function fmtClock(s){s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0')}

/* ---------- Termine: Ausfalltage (alle rücken nach) und einzelne Verschiebungen (#6) ---------- */
let sched={reha:[],updatedAt:0},moves={map:{},updatedAt:0},SKEY='',MKEY='';
function slotDate(n){const x=new Date(START);x.setDate(x.getDate()+Math.floor(n/ND)*7+OFFS[n%ND]);return x}
function slotOf(w,d){const k=(w-1)*ND+d,R=new Set(sched.reha);let c=-1;for(let n=0;;n++){if(!R.has(iso(slotDate(n)))){c++;if(c===k)return n}}}
function plannedDate(w,d){return slotDate(slotOf(w,d))}
function dateOf(w,d){const m=moves.map[ID(w,d)];return isIso(m)?fromIso(m):plannedDate(w,d)}
/* Angezeigt: tatsächlicher Trainingstag, sonst verschobener, sonst geplanter Termin */
function shownDate(w,d){const L=logs[ID(w,d)];return L&&isIso(L.doneOn)?fromIso(L.doneOn):dateOf(w,d)}
function shiftOf(w,d){return slotOf(w,d)-((w-1)*ND+d)}
function nextFree(w,d){const R=new Set(sched.reha);let n=slotOf(w,d)+1;while(R.has(iso(slotDate(n))))n++;return slotDate(n)}

/* ---------- Vorgaben ---------- */
function rx(e,w){const i=w-1,sc=(P.schemes[e.scheme]||[])[i]||[0,null],r=sc[1];let n=sc[0];
  if(e.format==='tabata'&&e.tabata){const t=e.tabata;return{n:t.rounds*t.sets,t:'Tabata '+t.work+'/'+t.rest+' s × '+t.rounds+(t.sets>1?' × '+t.sets+' Sätze':'')}}
  if(e.top&&w===P.topsetWeek)return{n:1,t:'Topsatz 1×5–8 @9',top:1};
  if(e.format==='per_pause')return{n,t:'1×'+(e.r||'')+' je Pause'};
  if(e.format==='circuit')return{n,t:n+(n===1?' Runde':' Runden')+' × '+(e.r||'')};
  if(e.format==='rounds')return{n,t:n+' Runden ('+(e.r||'')+')'};
  return{n,t:n+'×'+(e.r||'')+(r?' @'+r:'')+(e.side?' · '+e.side:'')}}
/* #10: Erfassung je Übung (Server liefert fields/tmode/wref, abgeleitet oder aus dem Plan) */
const FKEY={gewicht:'kg',wdh:'r',zeit:'t',band:'band'};
const fieldsOf=e=>e.format==='tabata'?['wdh']:(e.fields&&e.fields.length?e.fields:['gewicht','wdh']);
function capOf(e,f){if(f==='gewicht')return e.wref==='je_hand'?'kg/Hand':e.wref==='je_seite'?'kg/Seite':'kg';
  return f==='wdh'?'Wdh.':f==='zeit'?(e.tmode==='auf_zeit'?'Zeit (s)':'Sek.'):'Band'}
function secs(t){if(t==null||t==='')return null;const s=String(t).trim();let m=s.match(/^(\d+):(\d{2})$/);if(m)return +m[1]*60+ +m[2];
  m=s.match(/^(\d+)\s*(s|sek)?$/i);if(m)return +m[1];m=s.match(/(\d+)\s*[–-]\s*(\d+)\s*s\b/);if(m)return +m[2];m=s.match(/(\d+)\s*s\b/);if(m)return +m[1];m=s.match(/(\d+(?:[.,]\d+)?)\s*min/);if(m)return Math.round(parseFloat(m[1].replace(',','.'))*60);return null}
/* Wert eines Feldes; ältere Einträge hatten Zeiten im Wdh.-Feld („20 s“) */
function fval(e,s,f){const k=FKEY[f];if(f==='zeit'&&(s.t==null||s.t==='')&&s.r&&/\d\s*s\b/.test(s.r))return String(secs(s.r));return s[k]==null?'':s[k]}
function setText(e,s){const f=fieldsOf(e),out=[];
  if(f.includes('gewicht')&&s.kg)out.push(s.kg+' '+(e.wref==='je_hand'?'kg/Hand':'kg'));
  if(f.includes('band')&&s.band)out.push(s.band);
  if(f.includes('wdh')&&s.r&&!(f.includes('zeit')&&/\d\s*s\b/.test(s.r)))out.push('× '+s.r);
  if(f.includes('zeit')){const v=fval(e,s,'zeit');if(v)out.push(v+' s')}
  if(s.rpe)out.push('@'+s.rpe);return out.join(' ')||'–'}

/* ---------- Speicher & Sync ---------- */
let logs={},LKEY='';
function getLog(id){if(!logs[id])logs[id]={warm:[],sk:[],cool:false,ex:{},fb:{}};const L=logs[id];L.ex=L.ex||{};L.fb=L.fb||{};L.warm=L.warm||[];L.sk=L.sk||[];return L}
function exLog(L,b){if(!L.ex[b])L.ex[b]={sets:[],wu:[],note:''};const E=L.ex[b];E.sets=E.sets||[];E.wu=E.wu||[];return E}
const statusOf=L=>!L?'offen':L.status||(isIso(L.doneOn)?'fertig':'offen');
const ver={},saved={},inflight={};let saveT=null,retryT=null,mode='init',schedPend=false,movesPend=false;
async function api(method,url,body){
  const r=await fetch(url,{method,credentials:'same-origin',headers:body?{'content-type':'application/json'}:{},body:body?JSON.stringify(body):undefined});
  if(r.status===401){location.href='/login';throw new Error('401')}
  return r}
function store(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function setStatus(){const el=document.getElementById('status');
  const pend=Object.keys(ver).some(k=>ver[k]!==saved[k])||schedPend||movesPend;
  if(mode==='offline'){el.className='status err';el.innerHTML='<b></b>offline · '+(pend?'wird nachgeholt':'lokal');return}
  if(mode==='err'){el.className='status err';el.innerHTML='<b></b>Fehler beim Speichern';return}
  if(mode==='init'){el.className='status';el.innerHTML='<b></b>verbindet…';return}
  el.className='status '+(pend?'busy':'ok');el.innerHTML='<b></b>'+(pend?'speichert…':'gespeichert')}
function dropAndReload(){try{localStorage.removeItem(LKEY);localStorage.removeItem(SKEY);localStorage.removeItem(MKEY);localStorage.removeItem('slothly-plan')}catch(e){}location.reload()}
const revQ=()=>'?rev='+(P.revision||0);
function retryLater(){clearTimeout(retryT);retryT=setTimeout(()=>{flush();flushSched();flushMoves()},5000)}
function touchSched(){sched.updatedAt=Date.now();store(SKEY,sched);schedPend=true;flushSched();renderMain()}
function touchMoves(){moves.updatedAt=Date.now();store(MKEY,moves);movesPend=true;flushMoves();renderMain()}
async function flushSched(){if(!schedPend||mode==='init')return;schedPend=false;
  try{const r=await api('PUT','/api/plans/'+P.id+'/skips'+revQ(),{dates:sched.reha.slice(),updatedAt:sched.updatedAt});
    if(r.status===404)return dropAndReload();
    if(r.status===409){const d=await r.json();if(d.reload)return dropAndReload();sched={reha:d.dates||[],updatedAt:d.updatedAt||0};store(SKEY,sched);renderMain()}
    else if(!r.ok)throw new Error(r.status);mode='ok'}
  catch(e){schedPend=true;mode='offline';retryLater()}setStatus()}
async function flushMoves(){if(!movesPend||mode==='init')return;movesPend=false;
  try{const r=await api('PUT','/api/plans/'+P.id+'/moves'+revQ(),{map:moves.map,updatedAt:moves.updatedAt});
    if(r.status===404)return dropAndReload();
    if(r.status===409){const d=await r.json();if(d.reload)return dropAndReload();moves={map:d.map||{},updatedAt:d.updatedAt||0};store(MKEY,moves);renderMain()}
    else if(!r.ok)throw new Error(r.status);mode='ok'}
  catch(e){movesPend=true;mode='offline';retryLater()}setStatus()}
function touch(id){ver[id]=(ver[id]||0)+1;logs[id].updatedAt=Date.now();store(LKEY,logs);setStatus();clearTimeout(saveT);saveT=setTimeout(flush,700);refreshNav();refreshRun()}
async function flush(){if(mode==='init')return;
  for(const id of Object.keys(ver)){if(ver[id]===saved[id]||inflight[id])continue;inflight[id]=true;const v=ver[id];
    try{const r=await api('PUT','/api/plans/'+P.id+'/logs/'+id+revQ(),logs[id]);
      if(r.status===404)return dropAndReload();
      if(r.status===409){const d=await r.json();if(d.reload)return dropAndReload();if(d.data){logs[id]=d.data;store(LKEY,logs);if(id===ID(S.w,S.d)&&S.view==='s')renderMain()}saved[id]=ver[id];mode='ok'}
      else if(r.ok){saved[id]=v;mode='ok'}else mode='err'}
    catch(e){mode='offline';retryLater()}
    inflight[id]=false;if(mode==='ok'&&ver[id]!==saved[id])setTimeout(flush,400)}
  store(LKEY,logs);setStatus()}
async function pull(){
  try{const r=await api('GET','/api/plans/'+P.id+'/logs');if(r.status===404)return dropAndReload();if(!r.ok)throw new Error(r.status);
    const d=await r.json(),cur=ID(S.w,S.d);let changed=false;
    if((d.revision||0)!==(P.revision||0))return dropAndReload();
    for(const [id,remote] of Object.entries(d.logs||{})){if(ver[id]!==undefined&&ver[id]!==saved[id])continue;
      const local=logs[id];
      if(local&&(local.updatedAt||0)>(remote.updatedAt||0)){ver[id]=(ver[id]||0)+1;continue}
      if(!local||(remote.updatedAt||0)!==(local.updatedAt||0)){logs[id]=remote;if(id===cur)changed=true}}
    Object.keys(logs).forEach(id=>{if(!(id in (d.logs||{}))&&logs[id].updatedAt)ver[id]=(ver[id]||0)+1});
    const sk=d.skips||{dates:[],updatedAt:0};
    if((sk.updatedAt||0)>(sched.updatedAt||0)){sched={reha:(sk.dates||[]).slice(),updatedAt:sk.updatedAt};store(SKEY,sched);changed=true}
    else if((sk.updatedAt||0)<(sched.updatedAt||0))schedPend=true;
    const mv=d.moves||{map:{},updatedAt:0};
    if((mv.updatedAt||0)>(moves.updatedAt||0)){moves={map:mv.map||{},updatedAt:mv.updatedAt};store(MKEY,moves);changed=true}
    else if((mv.updatedAt||0)<(moves.updatedAt||0))movesPend=true;
    mode='ok';store(LKEY,logs);refreshNav();refreshRun();
    if(changed&&!document.activeElement.closest?.('#main'))renderMain();
    flush();flushSched();flushMoves()}
  catch(e){if(e.message!=='401'){mode='offline';retryLater()}}
  setStatus()}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&P)pull()});
window.addEventListener('online',()=>{if(P)pull()});

/* ---------- Navigation ---------- */
const S={w:1,d:0,view:'s'};
function runningId(){for(const [id,L] of Object.entries(logs))if(statusOf(L)==='laeuft')return id;return null}
function pickToday(){const run=runningId();if(run){const m=/^w(\d+)d(\d)$/.exec(run);S.w=+m[1];S.d=+m[2]-1;return}
  const t=today0();
  for(let w=1;w<=NW;w++)for(let d=0;d<ND;d++){const L=logs[ID(w,d)],st=statusOf(L);
    if(st==='offen'&&dateOf(w,d)>=t||st!=='offen'&&shownDate(w,d).getTime()===t.getTime()){S.w=w;S.d=d;return}}
  S.w=NW;S.d=ND-1}
function progress(w,d){const L=logs[ID(w,d)];let tot=0,done=0;
  DAYS[d].ex.forEach(e=>{const n=rx(e,w).n;tot+=n;const E=L&&L.ex&&L.ex[e.b];if(E&&E.sets)for(let i=0;i<n;i++)if(E.sets[i]&&E.sets[i].d)done++});return{tot,done}}
function dayMark(w,d){const st=statusOf(logs[ID(w,d)]);return st==='fertig'?' <span class="ok">✓</span>':st==='laeuft'?' <span class="ok">●</span>':st==='abgebrochen'?' <span style="color:var(--warn)">✕</span>':''}
function refreshNav(){
  let h='';for(let w=1;w<=NW;w++){let dots='';for(let d=0;d<ND;d++){const st=statusOf(logs[ID(w,d)]),p=progress(w,d);dots+='<i class="'+(st==='fertig'||p.tot&&p.done>=p.tot?'f':st!=='offen'||p.done?'p':'')+'"></i>'}
    h+='<button type="button" class="wk'+(S.view==='s'&&S.w===w?' on':'')+'" data-w="'+w+'">W'+w+'<small>'+fmtD(shownDate(w,0))+'</small><span class="dots">'+dots+'</span></button>'}
  h+='<button type="button" class="wk'+(S.view==='r'?' on':'')+'" data-rules="1">§<small>Regeln</small><span class="dots"></span></button>';
  document.getElementById('weeks').innerHTML=h;
  let dh='';DAYS.forEach((D,d)=>{const dt=shownDate(S.w,d);
    dh+='<button type="button" class="day'+(S.view==='s'&&S.d===d?' on':'')+'" data-d="'+d+'"><b>'+wdOf(dt)+' '+fmtD(dt)+dayMark(S.w,d)+'</b><small>'+esc(D.title)+'</small></button>'});
  document.getElementById('days').innerHTML=dh;
  const pb=document.getElementById('pbar');if(pb){const p=progress(S.w,S.d);pb.style.width=(p.tot?p.done/p.tot*100:0)+'%';document.getElementById('plbl').textContent=p.done+' / '+p.tot+' Sätze'}}
document.getElementById('weeks').addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;
  if(b.dataset.rules)S.view='r';else{S.view='s';S.w=+b.dataset.w}renderMain();window.scrollTo(0,0)});
document.getElementById('days').addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;S.view='s';S.d=+b.dataset.d;renderMain();window.scrollTo(0,0)});
/* Laufende Einheit in der Kopfzeile (#12) */
function refreshRun(){const c=document.getElementById('runchip'),id=runningId();
  if(!id){c.hidden=true;return}const L=logs[id];c.hidden=false;c.dataset.id=id;
  c.textContent='● '+fmtClock((Date.now()-(L.startedAt||Date.now()))/1000)}
document.getElementById('runchip').addEventListener('click',ev=>{const m=/^w(\d+)d(\d)$/.exec(ev.currentTarget.dataset.id||'');if(!m)return;S.view='s';S.w=+m[1];S.d=+m[2]-1;renderMain();window.scrollTo(0,0)});
setInterval(()=>{refreshRun();const el=document.getElementById('sclock');if(el){const L=logs[ID(S.w,S.d)];if(L&&L.startedAt)el.textContent=fmtClock((Date.now()-L.startedAt)/1000)}},1000);

/* ---------- Einheit: Start, Ende, Abbruch (#12) ---------- */
let sessUI=null;   // null | 'finish' | 'abort' | 'switch'
function lastSetAt(L){let m=0;Object.values(L.ex||{}).forEach(E=>(E.sets||[]).forEach(s=>{if(s&&s.at>m)m=s.at}));return m||null}
function startSession(L,at){L.status='laeuft';L.startedAt=at||Date.now();delete L.finishedAt;delete L.durS;if(!isIso(L.doneOn))L.doneOn=iso(new Date(L.startedAt))}
function finishSession(L,at){L.status='fertig';L.finishedAt=Math.max(at,L.startedAt||at);if(L.startedAt){L.durS=Math.round((L.finishedAt-L.startedAt)/1000);if(!L.fb.dur)L.fb.dur=String(Math.round(L.durS/60))}if(!isIso(L.doneOn))L.doneOn=iso(new Date(L.finishedAt))}
function sessBox(w,d){const id=ID(w,d),L=getLog(id),st=statusOf(L);
  const other=runningId();
  if(st==='offen'){
    if(sessUI==='switch'&&other&&other!==id){const m=/^w(\d+)d(\d)$/.exec(other),oL=logs[other];
      return '<div class="warnbox"><span>Die Einheit W'+m[1]+' Tag '+m[2]+' läuft noch (seit '+hhmm(oL.startedAt)+').</span><div class="sbtns"><button type="button" class="go" data-act="sw-finish">Jene beenden und hier starten</button><button type="button" class="tbtn" data-act="ui-close">Abbrechen</button></div></div>'}
    return '<button type="button" class="go wide" data-act="s-start">Training starten</button>'}
  if(st==='laeuft'){
    const stale=Date.now()-L.startedAt>3*3600e3||iso(new Date(L.startedAt))!==iso(new Date());
    let h='<div class="sinfo"><span><span class="badge run">läuft</span> seit '+hhmm(L.startedAt)+' · <b id="sclock">'+fmtClock((Date.now()-L.startedAt)/1000)+'</b></span>'+
      '<span class="sbtns"><button type="button" class="go" data-act="s-finish">Training beenden</button><button type="button" class="tbtn" data-act="s-abort">Abbrechen</button></span></div>';
    if(stale&&!sessUI){const la=lastSetAt(L)||L.startedAt+60*60e3;
      h='<div class="warnbox"><span>Diese Einheit läuft seit '+fmtDL(new Date(L.startedAt))+', '+hhmm(L.startedAt)+'. Vergessen zu beenden?</span>'+
        '<div class="sbtns"><button type="button" class="go" data-act="s-end-at" data-v="'+la+'">Um '+hhmm(la)+' beenden (letzter Satz)</button><button type="button" class="tbtn" data-act="s-finish">Anderes Ende…</button></div></div>'+h}
    if(sessUI==='finish')h+=finishBox(w,d,L);
    if(sessUI==='abort')h+='<div class="finbox"><b>Einheit abbrechen?</b><span>Die Einträge bleiben erhalten, die Einheit gilt als abgebrochen.</span>'+
      '<label>Grund (optional)<input id="abortwhy" maxlength="200" placeholder="z. B. Schulter, keine Zeit"></label>'+
      '<div class="sbtns"><button type="button" class="go" data-act="s-abort-ok">Abbrechen bestätigen</button><button type="button" class="tbtn" data-act="ui-close">Zurück</button></div></div>';
    return h}
  if(st==='fertig')return '<div class="sinfo"><span><span class="badge ok">fertig</span> '+(L.startedAt?hhmm(L.startedAt)+'–'+hhmm(L.finishedAt||L.startedAt)+' · ':'')+(L.durS?Math.round(L.durS/60)+' min':L.fb.dur?L.fb.dur+' min':'')+'</span><span class="sbtns"><button type="button" class="tbtn" data-act="s-reopen">Wieder öffnen</button></span></div>';
  return '<div class="sinfo"><span><span class="badge ab">abgebrochen</span> '+esc(L.abortReason||'')+'</span><span class="sbtns"><button type="button" class="tbtn" data-act="s-reopen">Wieder öffnen</button></span></div>'}
function finishBox(w,d,L){const D=DAYS[d],p=progress(w,d),open=[];
  D.ex.forEach(e=>{const n=rx(e,w).n,E=L.ex[e.b];let c=0;if(E)for(let i=0;i<n;i++)if(E.sets[i]&&E.sets[i].d)c++;if(c<n)open.push(e.b+' '+e.n+' ('+c+'/'+n+')')});
  const now=Date.now(),dur=(now-L.startedAt)/1000;
  return '<div class="finbox"><b>Training beenden</b>'+
    '<span>Dauer <b>'+fmtClock(dur)+'</b> · Sätze <b>'+p.done+' / '+p.tot+'</b></span>'+
    (open.length?'<div><span>Noch offen:</span><ul>'+open.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div>':'<span>Alle Sätze erledigt.</span>')+
    (L.fb.form?'':'<div><span>Tagesform heute?</span><div class="form5" style="margin-top:6px">'+[1,2,3,4,5].map(n=>'<button type="button" data-act="form" data-v="'+n+'">'+n+'</button>').join('')+'</div></div>')+
    '<label>Ende (falls vergessen)<input type="time" id="finat" value="'+hhmm(now)+'"></label>'+
    '<div class="sbtns"><button type="button" class="go" data-act="s-finish-ok">Beenden</button><button type="button" class="tbtn" data-act="ui-close">Weiter trainieren</button></div></div>'}

/* ---------- Verschieben (#6) ---------- */
let moveUI=false;
function moveBox(w,d){const id=ID(w,d),L=logs[id],st=statusOf(L);if(st==='fertig'||st==='abgebrochen')return '';
  const planned=plannedDate(w,d),mv=moves.map[id];
  let h='';
  if(isIso(mv))h+='<div class="sinfo"><span>Verschoben auf <b>'+fmtDL(fromIso(mv))+'</b> (geplant '+wdOf(planned)+' '+fmtD(planned)+')</span><span class="sbtns"><button type="button" class="tbtn" data-act="mv-undo">Verschiebung aufheben</button></span></div>';
  if(!moveUI)return h+'<button type="button" class="rehabtn" data-act="mv-open">Einheit verschieben</button>';
  const tm=new Date();tm.setDate(tm.getDate()+1);const nx=nextFree(w,d);
  return h+'<div class="rconf"><b>Einheit verschieben</b>'+
    '<label class="chk"><input type="radio" name="mvk" value="one" checked> Nur diese Einheit, alle anderen bleiben</label>'+
    '<div class="sbtns" id="mvdate"><input type="date" id="mvd" value="'+iso(tm)+'" style="height:40px;border:1px solid var(--line);border-radius:9px;padding:0 10px;background:var(--surface);font-size:16px">'+
      '<button type="button" class="tbtn" data-act="mv-q" data-v="'+iso(tm)+'">Morgen</button><button type="button" class="tbtn" data-act="mv-q" data-v="'+iso(nx)+'">Nächster Trainingstag ('+wdOf(nx)+')</button></div>'+
    '<span id="mvwarn" style="color:var(--warn)"></span>'+
    '<label class="chk"><input type="radio" name="mvk" value="all"> Diese und alle folgenden rücken je einen Termin weiter ('+wdOf(planned)+' '+fmtD(planned)+' fällt aus, diese Einheit kommt '+wdOf(nx)+' '+fmtD(nx)+')</label>'+
    '<div class="btns"><button type="button" class="go" data-act="mv-ok">Verschieben</button><button type="button" class="tbtn" data-act="mv-close">Abbrechen</button></div></div>'}
function moveWarn(){const el=document.getElementById('mvwarn'),v=(document.getElementById('mvd')||{}).value;if(!el)return;el.textContent='';
  if(!isIso(v))return;for(let w=1;w<=NW;w++)for(let d=0;d<ND;d++){if(w===S.w&&d===S.d)continue;if(iso(shownDate(w,d))===v){el.textContent='Am '+fmtD(fromIso(v))+' liegt schon W'+w+' Tag '+(d+1)+' ('+DAYS[d].title+').';return}}}

/* ---------- Einheit darstellen ---------- */
const VKEY='slothly-view';let VIEW='runden';try{VIEW=localStorage.getItem(VKEY)||'runden'}catch(e){}
function lastFor(d,b,w){for(let x=w-1;x>=1;x--){const L=logs[ID(x,d)];const E=L&&L.ex&&L.ex[b];
  if(E&&E.sets&&E.sets.some(s=>s&&(s.kg||s.r||s.t||s.band)))return{w:x,sets:E.sets.filter(s=>s&&(s.kg||s.r||s.t||s.band))}}return null}
function checkItem(attrs,on,text,sub,q){return '<button type="button" class="ci'+(on?' on':'')+'" '+attrs+'><span class="tick">'+TICK+'</span><span class="tx">'+esc(text)+(q?'<a class="vid" href="'+vidUrl(q)+'" target="_blank" rel="noopener">▶</a>':'')+(sub?'<small>'+esc(sub)+'</small>':'')+'</span></button>'}
function groupsOf(D){const gs=[];D.ex.forEach(e=>{const g=e.b==='A+'?'A':e.b[0];let G=gs.find(x=>x.g===g);if(!G){G={g,ex:[]};gs.push(G)}G.ex.push(e)});return gs}
function renderSession(){const w=S.w,d=S.d,D=DAYS[d],id=ID(w,d),L=getLog(id),dt=shownDate(w,d),sh=isIso(L.doneOn)||moves.map[id]?0:shiftOf(w,d);
  let h='<div class="meta"><div><span class="phase">Woche '+w+' · '+esc(PHASE[w-1]||'')+'</span><h2>Tag '+(d+1)+' · '+esc(D.title)+'</h2></div>'+
   '<p>'+wdOf(dt)+', '+fmtD(dt)+dt.getFullYear()+(P.dayNote?' · '+esc(P.dayNote):'')+'</p>'+
   (sh?'<p class="shift">Wegen Ausfall um '+sh+' Termin'+(sh>1?'e':'')+' verschoben</p>':'')+
   '<div class="sess" id="sessbox">'+sessBox(w,d)+'</div>'+
   '<div class="sess" id="movebox">'+moveBox(w,d)+'</div>'+
   '<div class="bar"><i id="pbar"></i></div><div class="barlbl"><span>Fortschritt</span><span id="plbl"></span></div></div>';
  if(D.warm&&D.warm.length){h+='<section class="box"><div class="boxh"><h3>Aufwärmen</h3><span>je 1 Runde</span></div><div class="checks">';
    D.warm.forEach((t,i)=>{h+=checkItem('data-act="warm" data-i="'+i+'"',L.warm[i],t)});h+='</div></section>'}
  const SB=D.skillBlock;
  if(SB&&SB.weeks&&SB.weeks.length){const items=SB.weeks[Math.min(w,SB.weeks.length)-1]||[];
    h+='<section class="box"><div class="boxh"><h3>Skill · '+esc(SB.title)+'</h3><span>'+esc(SB.dur||'')+'</span></div>'+(SB.hint?'<p class="skhint">'+esc(SB.hint)+'</p>':'')+'<div class="checks">';
    items.forEach((it,i)=>{h+=checkItem('data-act="sk" data-i="'+i+'"',L.sk[i],it.n,it.v,it.q)});
    h+='</div><div style="padding:0 14px 12px"><textarea class="note" id="sknote-'+id+'" data-sknote="1" rows="1" placeholder="Notiz, z. B. Zeit beim Test">'+esc(L.skNote)+'</textarea></div></section>'}
  const gname=D.groups||{};
  groupsOf(D).forEach(G=>{const multi=G.ex.filter(e=>e.format!=='tabata').length>1;
    h+='<section class="box" data-g="'+G.g+'"><div class="ssrow"><span class="ss">'+esc(gname[G.g]||('Block '+G.g))+'</span>'+
      (multi?'<button type="button" class="vtog" data-act="view">'+(VIEW==='runden'?'Ansicht: Runden':'Ansicht: Übungen')+'</button>':'')+'</div>';
    const ck=(D.clocks||{})[G.g];if(ck)h+=wodBar(G,ck,L);
    if(multi&&VIEW==='runden')h+=renderRounds(G,w,d,L);
    else G.ex.forEach(e=>{h+=e.format==='tabata'?renderTabataEx(e,w,d,L):renderEx(e,w,d,L)});
    h+='</section>'});
  if(D.cool)h+='<section class="box"><div class="boxh"><h3>Cool-down</h3><span>optional</span></div><div class="checks">'+checkItem('data-act="cool"',L.cool,D.cool)+'</div></section>';
  if(D.notes&&D.notes.length)h+='<section class="box"><div class="boxh"><h3>Hinweise</h3></div><div class="hint">'+D.notes.map(n=>'<span>'+esc(n)+'</span>').join('')+'</div></section>';
  const F=L.fb;
  h+='<section class="box"><div class="boxh"><h3>Feedback</h3></div><div class="fb">'+
   '<div><div class="formhint" style="margin-bottom:6px">Tagesform</div><div class="form5" id="form5">'+[1,2,3,4,5].map(n=>'<button type="button" data-act="form" data-v="'+n+'" class="'+(F.form==n?'on':'')+'">'+n+'</button>').join('')+'</div>'+
   '<div class="formhint'+(F.form&&F.form<=2?' low':'')+'" id="formhint" style="margin-top:6px">'+formHint(F.form)+'</div></div>'+
   '<label>Trainiert am (für Nachträge ändern)<input type="date" id="fb-date-'+id+'" data-done="1" value="'+esc(L.doneOn||'')+'"></label>'+
   '<div class="row"><label>Dauer (min)<input id="fb-dur-'+id+'" data-fb="dur" inputmode="numeric" value="'+esc(F.dur)+'"></label><label>Schlaf (h)<input id="fb-sl-'+id+'" data-fb="sleep" inputmode="decimal" value="'+esc(F.sleep)+'"></label><label>Gewicht (kg)<input id="fb-bw-'+id+'" data-fb="bw" inputmode="decimal" value="'+esc(F.bw)+'"></label></div>'+
   '<label>Schmerzen / Beschwerden (wo, Übung, 0–10, Folgetag)<textarea id="fb-p-'+id+'" data-fb="pain">'+esc(F.pain)+'</textarea></label>'+
   '<label>Was war zu leicht, was zu schwer?<textarea id="fb-e-'+id+'" data-fb="easy">'+esc(F.easy)+'</textarea></label>'+
   '<label>Was will ich nächste Woche ändern?<textarea id="fb-c-'+id+'" data-fb="change">'+esc(F.change)+'</textarea></label>'+
   (statusOf(L)==='laeuft'?'<button type="button" class="go wide" data-act="s-finish">Training beenden</button>':'')+
   '</div></section>';
  return h}
function formHint(v){if(!v)return '1 sehr schlecht · 2 schlecht · 3 okay · 4 gut · 5 sehr gut';return v<=2?'Gewicht halten oder 5–10 % weniger.':'Plan wie geschrieben.'}
/* Kopf einer Übung: Name, Video, Vorgabe, Start, Pause, letztes Mal, Aufwärmsätze */
function exInfo(e,w,d,L,withName){const R=rx(e,w),E=exLog(L,e.b),last=lastFor(d,e.b,w);
  let h='';
  if(withName)h+='<div class="exh"><span class="blk'+(e.b[0]==='E'?' reha':'')+'">'+esc(e.b)+'</span><div class="exn"><h4>'+esc(e.n)+'</h4>';
  h+=(withName?'':'<div>')+'<a class="vid" href="'+vidUrl(e.q||e.n)+'" target="_blank" rel="noopener">▶ Video ansehen</a><div class="mu">'+[e.m,e.k?'Kadenz '+e.k:'',e.i].filter(Boolean).map(esc).join(' · ')+'</div></div>'+(withName?'</div>':'');
  h+='<div class="facts"><span class="fact rx">'+esc(R.t)+'</span>'+(e.st?'<span class="fact">Start: '+esc(e.st)+'</span>':'')+(e.pa?'<span class="fact">Pause: '+esc(e.pa)+'</span>':'')+(e.cap?'<span class="fact sh">'+esc(e.cap)+'</span>':'')+'</div>';
  if(last)h+='<div class="last">Letztes Mal (W'+last.w+'): <b>'+last.sets.map(s=>esc(setText(e,s))).join(' · ')+'</b></div>';
  if(e.wu)h+='<div class="ramp">Aufwärmsätze:'+['10 ohne','50 % × 8','75 % × 4'].map((t,i)=>'<button type="button" class="rb'+(E.wu[i]?' on':'')+'" data-act="wu" data-b="'+esc(e.b)+'" data-i="'+i+'"><span class="tick'+(E.wu[i]?' on':'')+'">'+TICK+'</span>'+t+'</button>').join('')+'</div>';
  return h}
/* Eine Satzzeile mit den Feldern der Übung (#10). lbl: Satznummer bzw. Block-Label in der Rundenansicht */
function rowHtml(e,w,d,L,i,lbl,caps){const E=exLog(L,e.b),s=E.sets[i]||{},R=rx(e,w),f=fieldsOf(e),last=lastFor(d,e.b,w),prev=last?last.sets:[];
  const pv=k=>{const p=prev[i]||prev[0];return p?(k==='t'?fval(e,p,'zeit'):p[k]||''):''};
  const base='set-'+ID(w,d)+'-'+e.b+'-'+i;
  let cells='';
  f.forEach(fl=>{const k=FKEY[fl];let ph=pv(k);
    if(!ph&&fl==='wdh')ph=(e.format==='standard'||e.format==='per_pause')?String(e.r||'').replace('–','-'):'';
    if(!ph&&fl==='zeit'){const sv=secs(e.r);ph=sv?String(sv):''}
    if(!ph&&fl==='band'&&/band/i.test(e.st||''))ph=String(e.st).replace(/^band\s*/i,'');
    const im=fl==='gewicht'?'decimal':fl==='band'?'text':'numeric';
    const clk=fl==='zeit'||(fl==='wdh'&&e.tmode==='in_zeit')?'<button type="button" class="clk" data-act="rowclk" data-b="'+esc(e.b)+'" data-i="'+i+'" aria-label="Uhr für diesen Satz">'+CLKI+'</button>':'';
    cells+='<label class="fi">'+(caps?'<span>'+esc(capOf(e,fl))+'</span>':'')+'<span class="iw"><input id="'+base+'-'+k+'" data-b="'+esc(e.b)+'" data-i="'+i+'" data-k="'+k+'" inputmode="'+im+'" placeholder="'+esc(ph)+'" value="'+esc(fval(e,s,fl))+'" aria-label="'+esc(e.b+' Satz '+(i+1)+' '+capOf(e,fl))+'">'+clk+'</span></label>'});
  cells+='<label class="fi">'+(caps?'<span>RPE</span>':'')+'<input id="'+base+'-rpe" data-b="'+esc(e.b)+'" data-i="'+i+'" data-k="rpe" inputmode="decimal" value="'+esc(s.rpe)+'" aria-label="'+esc(e.b+' Satz '+(i+1))+' RPE"></label>';
  const cols='34px repeat('+f.length+',minmax(0,1fr)) 56px 44px';
  return '<div class="sr'+(s.d?' done':'')+(e.format==='per_pause'?' filler':'')+'" style="grid-template-columns:'+cols+'" data-b="'+esc(e.b)+'" data-i="'+i+'" data-lbl="'+esc(e.b+' '+e.n+' · Satz '+(i+1))+'">'+
    '<span class="lb">'+lbl+'</span>'+cells+
    '<button type="button" class="sb'+(s.d?' on':'')+'" data-act="set" data-b="'+esc(e.b)+'" data-i="'+i+'" aria-label="'+esc(e.b)+' Satz '+(i+1)+' erledigt">'+TICKB+'</button></div>'}
function renderEx(e,w,d,L){const R=rx(e,w),E=exLog(L,e.b);
  let h='<div class="ex" data-ex="'+esc(e.b)+'">'+exInfo(e,w,d,L,true)+'<div class="sets">';
  for(let i=0;i<R.n;i++)h+=rowHtml(e,w,d,L,i,R.top?'T':String(i+1),i===0);
  return h+'</div><textarea class="note" id="note-'+ID(w,d)+'-'+esc(e.b)+'" data-note="'+esc(e.b)+'" rows="1" placeholder="Kommentar">'+esc(E.note)+'</textarea></div>'}
/* #8: Supersatz, Zirkel, Pausenfüller rundenweise: Runde 1: B1 · B2, Runde 2: … */
function renderRounds(G,w,d,L){let h='';const ns=G.ex.map(e=>rx(e,w).n),max=Math.max(0,...ns);
  G.ex.forEach(e=>{const R=rx(e,w),E=exLog(L,e.b);
    h+='<details class="exd"><summary><span class="blk'+(e.b[0]==='E'?' reha':'')+'">'+esc(e.b)+'</span><span><h4>'+esc(e.n)+'</h4><small>'+esc(R.t)+(e.st?' · Start '+esc(e.st):'')+'</small></span><span class="chev">›</span></summary>'+
      '<div class="exb">'+exInfo(e,w,d,L,false)+'<textarea class="note" id="note-'+ID(w,d)+'-'+esc(e.b)+'" data-note="'+esc(e.b)+'" rows="1" placeholder="Kommentar">'+esc(E.note)+'</textarea></div></details>'});
  for(let i=0;i<max;i++){const inR=G.ex.filter((e,k)=>ns[k]>i);
    const done=inR.every(e=>{const s=exLog(L,e.b).sets[i];return s&&s.d});
    h+='<div class="round'+(done?' done':'')+'"><div class="rn"><span>Runde '+(i+1)+(i+1===max?' von '+max:'')+'</span><b>'+(done?'✓':'')+'</b></div>';
    inR.forEach(e=>{if(e.format==='per_pause')h+='<div class="ph">in der Pause:</div>';
      h+=rowHtml(e,w,d,L,i,esc(e.b)+(rx(e,w).top?'<small>Top</small>':''),i===0)});
    h+='</div>'}
  return h}
/* #11: Tabata als Übung im Plan */
function renderTabataEx(e,w,d,L){const t=e.tabata||{work:20,rest:10,rounds:8,sets:1,setRest:60,ex:[e.n]},E=exLog(L,e.b),n=t.rounds*t.sets;
  const reps=[];for(let i=0;i<n;i++){const s=E.sets[i];reps.push(s&&s.r!==''&&s.r!=null?+s.r:null)}
  const got=reps.filter(x=>x!=null);
  let h='<div class="ex" data-ex="'+esc(e.b)+'">'+exInfo(e,w,d,L,true)+
    '<div class="facts">'+(t.ex||[]).map((x,i)=>'<span class="fact">'+(t.ex.length>1?'R'+(i+1)+': ':'')+esc(x)+'</span>').join('')+'</div>'+
    '<button type="button" class="go wide" data-act="tb-start" data-b="'+esc(e.b)+'">Tabata starten</button>'+
    '<div class="tbres">';
  for(let i=0;i<n;i++)h+='<label>'+(t.sets>1?'S'+(Math.floor(i/t.rounds)+1)+' ':'')+'R'+(i%t.rounds+1)+'<input data-tbr="'+esc(e.b)+'" data-i="'+i+'" inputmode="numeric" value="'+(reps[i]==null?'':reps[i])+'"></label>';
  h+='</div><div class="tbsum">Summe <b>'+(got.length?got.reduce((a,b)=>a+b,0):'–')+'</b> · schwächste Runde <b>'+(got.length?Math.min(...got):'–')+'</b></div>'+
    '<textarea class="note" id="note-'+ID(w,d)+'-'+esc(e.b)+'" data-note="'+esc(e.b)+'" rows="1" placeholder="Kommentar, Gewicht">'+esc(E.note)+'</textarea></div>';
  return h}
function markNext(scroll){const rows=[...document.querySelectorAll('#main .sr[data-b]')];rows.forEach(r=>r.classList.remove('next'));
  const nx=rows.find(r=>!r.classList.contains('done'));if(!nx)return null;nx.classList.add('next');
  if(scroll){const b=nx.getBoundingClientRect();if(b.top<120||b.bottom>innerHeight-110)nx.scrollIntoView({block:'center',behavior:'smooth'})}
  return nx}

  let dates=[];for(let w=1;w<=NW;w++)dates.push(['W'+w,...DAYS.map((_,d)=>{const x=shownDate(w,d);return wdOf(x)+' '+fmtD(x)+mark(w,d)})]);

  const sec=r=>'<section class="box"><h3>'+md(r.title||'')+'</h3>'+(r.table?t(r.table.rows||[],r.table.head||[]):'')+
    (r.p||[]).map(x=>'<p>'+md(x)+'</p>').join('')+(r.ul&&r.ul.length?'<ul>'+r.ul.map(x=>'<li>'+md(x)+'</li>').join('')+'</ul>':'')+'</section>';

  try{const r=await api('POST','/api/plans/check',{plan,replaceId:P?P.id:undefined});const d=await r.json();

  catch(e){if(e.message!=='401')showPrev('<div class="prev"><h4 class="bad">Prüfung fehlgeschlagen</h4><p class="muted">'+esc(e.message)+'</p></div>')}}

/* ---------- Uhr: Pause, Stoppuhr, Timer, Tabata (#7, #9, #11) ---------- */
let CLK=null,actx=null,wake=null,clkInt=null,sheetTab='stopwatch',sheetOpen=false;
const TM=document.getElementById('timer');
function primeAudio(){try{if(!actx){const A=window.AudioContext||window.webkitAudioContext;if(A)actx=new A()}if(actx&&actx.state==='suspended')actx.resume()}catch(e){}}
function tone(f,dur,at){try{if(!actx)return;const os=actx.createOscillator(),g=actx.createGain();os.frequency.value=f;g.gain.value=.16;os.connect(g);g.connect(actx.destination);os.start(actx.currentTime+(at||0));os.stop(actx.currentTime+(at||0)+dur)}catch(e){}}
function beep(kind){if(kind==='tick')tone(660,.09);else if(kind==='go'){tone(988,.35)}else{[0,.25,.5].forEach(o=>tone(880,.15,o))}
  try{navigator.vibrate&&navigator.vibrate(kind==='tick'?60:[200,100,200])}catch(e){}}
async function lock(){try{if(!wake&&navigator.wakeLock){wake=await navigator.wakeLock.request('screen');wake.addEventListener('release',()=>{wake=null})}}catch(e){wake=null}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&CLK)lock()});
const now=()=>Date.now();
/* Laufzeit aus Startzeitpunkt rechnen (stimmt nach Bildschirmsperre) */
function elapsed(c){return ((c.paused?c.pausedAt:now())-c.start-c.pauseAcc)/1000}
function left(c){return c.dur-elapsed(c)}
function clkSet(o){CLK=Object.assign({start:now(),pauseAcc:0,paused:false,pausedAt:0,beeps:{},laps:[]},o);lock();if(!clkInt)clkInt=setInterval(clkTick,200);clkTick()}
function clkStop(){CLK=null;TM.hidden=true;TM.className='timer';renderSheet();clearInterval(clkInt);clkInt=null}
function clkPause(){if(!CLK||CLK.paused)return;CLK.paused=true;CLK.pausedAt=now();clkTick()}
function clkResume(){if(!CLK||!CLK.paused)return;CLK.pauseAcc+=now()-CLK.pausedAt;CLK.paused=false;clkTick()}
function clkTick(){const c=CLK;if(!c){TM.hidden=true;return}
  if(c.kind==='tabata'){tabataTick();return}
  if(c.kind==='wod'){wodTick();return}
  let txt,frac=0,over=false;
  if(c.kind==='stopwatch'||c.kind==='next'){txt=fmtClock(elapsed(c))}
  else{const l=left(c);frac=1-l/c.dur;
    if(!c.paused){[3,2,1].forEach(k=>{if(l<=k&&l>k-1&&!c.beeps['t'+k]){c.beeps['t'+k]=1;beep('tick')}});if(l<=0&&!c.beeps.end){c.beeps.end=1;beep('end');clkEnded(c)}}
    over=l<=0;txt=(over?'+':'')+fmtClock(Math.abs(l))}
  TM.hidden=false;TM.className='timer'+(over?' over':'')+(c.kind==='next'?' next':'');
  document.getElementById('tt').textContent=txt;
  document.getElementById('tl').textContent=c.label||'';
  document.getElementById('ts').textContent=over&&c.overSub?c.overSub:(c.sub||'');
  document.getElementById('tbar').style.width=Math.max(0,Math.min(100,frac*100))+'%';
  const btn=(a,t)=>'<button type="button" data-tact="'+a+'">'+t+'</button>';
  let b='';
  if(c.kind==='pause'||c.kind==='timer')b=(over?'':btn('m15','−15'))+btn('p15','+15')+btn('stop','Fertig');
  else if(c.kind==='stopwatch')b=c.bind?btn('take','Stopp · eintragen'):btn(c.paused?'resume':'pause',c.paused?'Weiter':'Stopp')+btn('stop','×');
  else if(c.kind==='next')b=btn('stop','×');
  const tb=document.getElementById('tbs');if(tb.dataset.h!==b){tb.innerHTML=b;tb.dataset.h=b}
  if(sheetOpen)updateSheet()}
function clkEnded(c){if(c.bind&&c.kind==='timer'){/* Wdh. in fester Zeit: Zeit um, Wdh. eintragen */const inp=document.querySelector('#main input[data-b="'+cssEsc(c.bind.b)+'"][data-i="'+c.bind.i+'"][data-k="r"]');if(inp)inp.closest('.sr').classList.add('next')}}
const cssEsc=s=>String(s).replace(/["\\]/g,'\\$&');
TM.addEventListener('click',ev=>{const a=ev.target.closest('[data-tact]');if(!a||!CLK)return;primeAudio();const k=a.dataset.tact,c=CLK;
  if(k==='open'){if(c.kind==='wod')renderWod();else openSheet(c.kind==='stopwatch'?'stopwatch':c.kind==='tabata'?'tabata':'timer')}
  else if(k==='stop')clkStop();
  else if(k==='p15'){c.dur+=15;c.beeps={};clkTick()}
  else if(k==='m15'){c.dur=Math.max(1,c.dur-15);clkTick()}
  else if(k==='pause')clkPause();else if(k==='resume')clkResume();
  else if(k==='take')takeStopwatch()});
/* Stoppuhr an einer Satzzeile: Zeit ins Feld schreiben */
function takeStopwatch(){const c=CLK;if(!c||!c.bind)return;const sec=Math.round(elapsed(c)),{id,b,i}=c.bind,L=getLog(id),E=exLog(L,b);
  const s=E.sets[i]=E.sets[i]||{};s.t=String(sec);touch(id);clkStop();
  const inp=document.querySelector('#main input[data-b="'+cssEsc(b)+'"][data-i="'+i+'"][data-k="t"]');if(inp)inp.value=s.t;toast(sec+' s eingetragen')}
/* #7: Pause nach dem Abhaken. Supersatz/Zirkel: erst nach der letzten Übung der Runde, dazwischen „weiter: B2“. */
function afterTick(e,i){const D=DAYS[S.d],G=groupsOf(D).find(g=>g.ex.includes(e)),w=S.w,L=getLog(ID(S.w,S.d));
  const nx=markNext(true),nxt=nx?nx.dataset.lbl:'';
  if(e.format==='per_pause')return;   // Pausenfüller läuft in der laufenden Pause
  const main=G.ex.filter(x=>x.format!=='per_pause'&&x.format!=='tabata'&&rx(x,w).n>i);
  if(main.length>1){const open=main.filter(x=>{const s=exLog(L,x.b).sets[i];return !(s&&s.d)});
    if(open.length){if(CLK&&(CLK.kind==='pause'||CLK.kind==='timer')&&left(CLK)>0)return;   // laufende Pause nicht wegnehmen
      clkSet({kind:'next',label:'Weiter: '+open[0].b+' · '+open[0].n,sub:'ohne Pause · Runde '+(i+1)});return}
    const ps=Math.max(0,...main.map(x=>x.ps||0));
    if(ps)clkSet({kind:'pause',dur:ps,label:'Pause · Runde '+(i+1)+' '+G.g+' fertig',sub:nxt?'Danach: '+nxt:'',overSub:nxt?'Los: '+nxt:'Weiter'});
    else if(CLK&&CLK.kind==='next')clkStop();
    return}
  if(e.ps)clkSet({kind:'pause',dur:e.ps,label:'Pause · '+e.b+' '+e.n,sub:nxt?'Danach: '+nxt:'',overSub:nxt?'Los: '+nxt:'Weiter'});
  else if(CLK&&CLK.kind==='next')clkStop()}

    h+='<div class="seg">'+[['amrap','AMRAP'],['emom','EMOM'],['fortime','For Time']].map(([v,t])=>'<button type="button" class="'+(k===v?'on':'')+'" data-sact="w-kind" data-v="'+v+'">'+t+'</button>').join('')+'</div>'+

      '<div class="qrow"><button type="button" class="go" data-sact="w-start">Start</button></div>'}
  else{h+='<div class="qrow">'+[[20,10,8,'Tabata 20/10 × 8'],[30,30,10,'30/30 × 10'],[40,20,8,'40/20 × 8']].map(([a,b,c,t])=>'<button type="button" data-sact="tb-pre" data-v="'+a+','+b+','+c+'">'+t+'</button>').join('')+'</div>'+

  OV.innerHTML=h+'</div></div>'}
function lapsHtml(){const c=CLK;if(!c||!c.laps.length)return '';let prev=0;return c.laps.map((t,i)=>{const d=t-prev;prev=t;return '<div><span>Runde '+(i+1)+'</span><span>'+fmtClock(d)+' · '+fmtClock(t)+'</span></div>'}).reverse().join('')}

function parseMmSs(v){const m=String(v||'').trim().match(/^(\d+)(?::(\d{1,2}))?$/);if(!m)return 0;return m[2]!==undefined?+m[1]*60+ +m[2]:+m[1]}

/* Tabata: Phasen vorab berechnen, aktuelle Phase aus der Laufzeit (#11) */
let TB=null;
function startTabata(cfg,bind){const ph=[{k:'pre',d:10}];
  for(let s=0;s<cfg.sets;s++){for(let r=0;r<cfg.rounds;r++){const idx=s*cfg.rounds+r;ph.push({k:'work',d:cfg.work,idx,s,r,ex:cfg.ex[r%cfg.ex.length]});
      if(r<cfg.rounds-1&&cfg.rest)ph.push({k:'rest',d:cfg.rest,idx,s,r});}
    if(s<cfg.sets-1&&cfg.setRest)ph.push({k:'setrest',d:cfg.setRest,idx:s*cfg.rounds+cfg.rounds-1,s})}
  let t=0;ph.forEach(p=>{p.at=t;t+=p.d});
  const reps=new Array(cfg.rounds*cfg.sets).fill(null);
  if(bind){const E=exLog(getLog(bind.id),bind.b);E.sets.forEach((s,i)=>{if(s&&s.r!=null&&s.r!=='')reps[i]=+s.r})}
  TB={cfg,ph,total:t,reps,bind,done:false};sheetOpen=false;clkSet({kind:'tabata'});renderTabata()}
function tbPhase(){const t=elapsed(CLK);let cur=TB.ph[TB.ph.length-1];for(const p of TB.ph){if(t<p.at+p.d){cur=p;break}}return{p:cur,t,left:cur.at+cur.d-t,end:t>=TB.total}}
function tabataTick(){if(!TB)return;const st=tbPhase();
  if(!CLK.paused){const k=st.p.at;
    if(st.end&&!TB.done){TB.done=true;beep('end');saveTabata(true);renderTabata();return}
    if(!st.end){[3,2,1].forEach(n=>{if(st.left<=n&&st.left>n-1&&!CLK.beeps[k+'_'+n]){CLK.beeps[k+'_'+n]=1;beep('tick')}});
      if(!CLK.beeps['s'+k]){CLK.beeps['s'+k]=1;if(st.p.k==='work')beep('go');else if(st.p.k!=='pre')beep('end');if(TB.lastPh!==k){TB.lastPh=k;renderTabata();return}}}}
  const n=document.getElementById('tbnum');if(n)n.textContent=TB.done?'✓':String(Math.ceil(Math.max(0,st.left)));
  TM.hidden=false;TM.className='timer';document.getElementById('tt').textContent=TB.done?'fertig':String(Math.ceil(Math.max(0,st.left)));
  document.getElementById('tl').textContent='Tabata · '+(TB.done?'fertig':phName(st.p.k));document.getElementById('ts').textContent='';
  const tb=document.getElementById('tbs');if(tb.dataset.h!=='tb'){tb.innerHTML='';tb.dataset.h='tb'}}
const phName=k=>({pre:'Gleich geht’s los',work:'Arbeit',rest:'Pause',setrest:'Satzpause'}[k]||'');
function renderTabata(){if(!TB){OV.innerHTML='';return}const st=tbPhase(),c=TB.cfg,p=st.p;
  if(TB.done){const got=TB.reps.filter(x=>x!=null);
    OV.innerHTML='<div class="tbt"><div class="hd"><span>Tabata '+c.work+'/'+c.rest+' × '+c.rounds+(c.sets>1?' × '+c.sets:'')+'</span><span></span></div>'+
      '<div class="mid"><div class="ph">Fertig</div><div class="sum"><div>Summe <b>'+(got.length?got.reduce((a,b)=>a+b,0):'–')+'</b> · schwächste Runde <b>'+(got.length?Math.min(...got):'–')+'</b></div>'+
      '<div class="tbres">'+TB.reps.map((r,i)=>'<label>'+(c.sets>1?'S'+(Math.floor(i/c.rounds)+1)+' ':'')+'R'+(i%c.rounds+1)+'<input data-tbrep="'+i+'" inputmode="numeric" value="'+(r==null?'':r)+'"></label>').join('')+'</div>'+
      (TB.bind?'<span style="font-size:14px;opacity:.85">Gespeichert in der Einheit.</span>':'')+'</div></div>'+
      '<div class="foot"><button type="button" data-tbact="close">Schließen</button></div></div>';return}
  const repIdx=p.k==='work'?p.idx-1:p.idx;   // in der Pause: Runde, die gerade vorbei ist
  const nextWork=TB.ph.find(x=>x.at>p.at&&x.k==='work');
  const rn=p.k==='pre'?1:(p.r??c.rounds-1)+1,sn=p.k==='pre'?1:(p.s??0)+1;
  OV.innerHTML='<div class="tbt '+p.k+'"><div class="hd"><span>Runde '+rn+'/'+c.rounds+(c.sets>1?' · Satz '+sn+'/'+c.sets:'')+'</span><span>'+fmtClock(TB.total-st.t)+' gesamt</span></div>'+
    '<div class="mid"><div class="ph">'+phName(p.k)+'</div><div class="num" id="tbnum">'+Math.ceil(Math.max(0,st.left))+'</div>'+
    (p.k==='work'?'<div class="ex">'+esc(p.ex)+'</div>':nextWork?'<div class="nx">Als Nächstes: '+esc(nextWork.ex)+'</div>':'')+
    (repIdx>=0&&p.k!=='pre'?'<div class="reps"><span>Wiederholungen Runde '+(repIdx%c.rounds+1)+(c.sets>1?' (Satz '+(Math.floor(repIdx/c.rounds)+1)+')':'')+'</span><div class="rr"><button type="button" data-tbact="minus" data-v="'+repIdx+'">−</button><b id="tbrv">'+(TB.reps[repIdx]==null?0:TB.reps[repIdx])+'</b><button type="button" data-tbact="plus" data-v="'+repIdx+'">+</button></div></div>':'')+
    '</div><div class="foot">'+(CLK.paused?'<button type="button" data-tbact="resume">Weiter</button>':'<button type="button" data-tbact="pause">Pause</button>')+
    (TB.confirmStop?'<button type="button" data-tbact="stop-ok">Wirklich abbrechen</button><button type="button" data-tbact="stop-no">Nein</button>':'<button type="button" data-tbact="stop">Abbrechen</button>')+'</div></div>'}
function tabataAction(k,a){if(!TB)return;
  if(k==='plus'||k==='minus'){const i=+a.dataset.v;TB.reps[i]=Math.max(0,(TB.reps[i]||0)+(k==='plus'?1:-1));const el=document.getElementById('tbrv');if(el)el.textContent=TB.reps[i];saveTabata(false);return}
  if(k==='pause'){clkPause();renderTabata()}else if(k==='resume'){clkResume();renderTabata()}
  else if(k==='stop'){TB.confirmStop=true;renderTabata()}else if(k==='stop-no'){TB.confirmStop=false;renderTabata()}
  else if(k==='stop-ok'||k==='close'){if(k==='stop-ok')saveTabata(true);TB=null;clkStop();OV.innerHTML='';if(S.view==='s')renderMain()}}
/* Ergebnis in die Einheit schreiben (nur bei Tabata aus dem Plan) */
function saveTabata(final){if(!TB||!TB.bind)return;const {id,b,g}=TB.bind,L=getLog(id);
  if(statusOf(L)==='offen'){startSession(L,CLK?CLK.start:Date.now())}
  if(g){L.clocks=L.clocks||{};const R=L.clocks[g]=L.clocks[g]||{kind:'intervall'};R.reps=TB.reps.slice();R.done=TB.done||!!final;R.at=R.at||Date.now();touch(id);return}
  const E=exLog(L,b);
  TB.reps.forEach((r,i)=>{const s=E.sets[i]=E.sets[i]||{};if(r==null){delete s.r;delete s.d}else{s.r=String(r);s.d=true;s.at=s.at||Date.now()}});
  touch(id)}

/* ---------- AMRAP, EMOM, For Time (#4) ----------
   Phasen wie beim Tabata vorab, aktuelle Phase aus der Laufzeit. Ergebnis im Log unter clocks.<Block>. */
let WO=null,wodFree={kind:'amrap',min:12,every:60,rounds:10};try{Object.assign(wodFree,JSON.parse(localStorage.getItem('slothly-wod')||'{}'))}catch(e){}
function readWodCfg(){document.querySelectorAll('[data-wcfg]').forEach(i=>{const v=parseInt(i.value,10);wodFree[i.dataset.wcfg]=v>0?v:null});
  wodFree.min=Math.min(90,Math.max(1,wodFree.min||12));wodFree.every=Math.min(600,Math.max(10,wodFree.every||60));wodFree.rounds=wodFree.rounds?Math.min(90,wodFree.rounds):(wodFree.kind==='emom'?10:null);store('slothly-wod',wodFree)}
const WODN={amrap:'AMRAP',emom:'EMOM',fortime:'For Time',intervall:'Intervall'};
function clockLbl(c){if(c.kind==='amrap')return 'AMRAP '+c.min+' min';if(c.kind==='fortime')return 'For Time'+(c.rounds?' · '+c.rounds+' Runden':'')+' · max. '+c.min+' min';
  if(c.kind==='emom')return (c.every===60?'EMOM ':'Alle '+fmtClock(c.every)+' · ')+c.rounds+(c.every===60?' min':' Runden');return 'Intervall '+c.work+'/'+c.rest+' s × '+c.rounds}
function startWod(cfg,bind,ex){const ph=[{k:'pre',d:10,at:0}];let t=10;
  if(cfg.kind==='emom'){for(let r=0;r<cfg.rounds;r++){ph.push({k:'work',d:cfg.every,at:t,r});t+=cfg.every}}
  else{ph.push({k:'work',d:cfg.min*60,at:t});t+=cfg.min*60}
  let res={kind:cfg.kind,rounds:0,reps:'',timeS:null,capped:false};

function wodPhase(){const t=elapsed(CLK);let cur=WO.ph[WO.ph.length-1];for(const p of WO.ph){if(t<p.at+p.d){cur=p;break}}return{p:cur,t,left:cur.at+cur.d-t,run:t-WO.ph[0].d,end:t>=WO.total}}
function wodTick(){if(!WO)return;const st=wodPhase();
  if(!CLK.paused&&!WO.done){const k=st.p.at;
    if(st.end){wodFinish(WO.cfg.kind==='fortime');return}
    [3,2,1].forEach(n=>{if(st.left<=n&&st.left>n-1&&!CLK.beeps[k+'_'+n]){CLK.beeps[k+'_'+n]=1;beep('tick')}});
    if(!CLK.beeps['s'+k]){CLK.beeps['s'+k]=1;if(st.p.k==='work')beep('go');if(WO.lastPh!==k){WO.lastPh=k;renderWod();return}}}

  document.getElementById('tl').textContent=WODN[WO.cfg.kind]+' · '+(WO.done?'fertig':st.p.k==='pre'?'gleich geht’s los':WO.cfg.kind==='emom'?'Runde '+(st.p.r+1)+'/'+WO.cfg.rounds:WO.res.rounds+' Runden');
  document.getElementById('ts').textContent='';const tb=document.getElementById('tbs');if(tb.dataset.h!=='wd'){tb.innerHTML='<button type="button" data-tact="open">Öffnen</button>';tb.dataset.h='wd'}}

  return WO.cfg.kind==='fortime'?fmtClock(Math.max(0,st.run)):fmtClock(Math.ceil(Math.max(0,st.left)))}
function wodFinish(capped){const st=wodPhase();WO.done=true;beep('end');
  if(WO.cfg.kind==='fortime'){WO.res.capped=!!capped;WO.res.timeS=capped?WO.cfg.min*60:Math.round(Math.max(0,st.run))}

  DAYS=P.days;PHASE=P.weekLabels||[];NW=P.weeks;ND=DAYS.length;OFFS=DAYS.map(d=>d.offset);
