name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: slothly
          POSTGRES_PASSWORD: slothly
          POSTGRES_DB: slothly
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U slothly" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://slothly:slothly@localhost:5432/slothly
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
